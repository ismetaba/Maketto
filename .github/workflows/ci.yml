name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Xcode 16 (iOS 18 SDK) and Xcode 26 (iOS 26 SDK): the code must build
        # with both strict-concurrency toolchains.
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          ls -d /Applications/Xcode*.app || true
          xcodebuild -version
          swift --version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      # A generic device build compiles every RoomPlan/ARKit code path, which
      # the simulator SDK may compile out.
      - name: Build for device
        run: |
          set -o pipefail
          xcodebuild build \
            -project Maketto.xcodeproj -scheme Maketto -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO -quiet

      # Running needs a booted simulator; one OS is enough for behaviour, so the
      # newer image only proves the tests COMPILE with its toolchain.
      - name: Unit tests (simulator)
        if: matrix.os == 'macos-15'
        timeout-minutes: 25
        run: |
          set -o pipefail
          UDID=$(python3 scripts/pick-simulator.py)
          xcodebuild test \
            -project Maketto.xcodeproj -scheme Maketto -configuration Debug \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO -quiet

      - name: Build tests (simulator)
        if: matrix.os != 'macos-15'
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Maketto.xcodeproj -scheme Maketto -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO -quiet
