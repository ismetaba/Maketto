name: Maketto

options:
  bundleIdPrefix: com.matt.maketto
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  Maketto:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: Sources

    info:
      path: Sources/App/Info.generated.plist
      properties:
        CFBundleDisplayName: Maketto
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: >-
          We use the camera and LiDAR sensor to scan the dimensions of your
          room so you can design and furnish it.
        UIRequiredDeviceCapabilities:
          - arm64
        UIAppFonts:
          - CormorantGaramond-VF.ttf
          - CormorantGaramond-Italic-VF.ttf

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matt.maketto
        PRODUCT_NAME: Maketto
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

schemes:
  Maketto:
    build:
      targets:
        Maketto: all
    run:
      config: Debug
    archive:
      config: Release
